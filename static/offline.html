<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#064a55">
<title>Neersagar ERP – Offline</title>
<link rel="icon" href="/img/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="auth-wrap">
  <main class="auth-card center stack">
    <div class="auth-brand"><div class="logo"><svg class="i" aria-hidden="true"><use href="/img/icons.svg#neersagar"/></svg></div><p class="wordmark">Neersagar</p></div>
    <div class="empty">
      <div class="ico"><svg class="i" aria-hidden="true"><use href="/img/icons.svg#wifi-off"/></svg></div>
      <h1 style="font-size:1.35rem">You are offline</h1>
      <p>The server cannot be reached right now. Nothing is lost - anything you typed on a form is kept on this device and can be sent once the connection is back.</p>
      <button class="btn primary" id="retry" type="button">Try again</button>
    </div>
  </main>
</div>
<script type="module" src="/js/offline.js"></script>
</body>
</html>
