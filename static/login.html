<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#064a55">
<title>Sign in - Water ERP</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/icon-192.png">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="auth-wrap">
  <div id="banners" class="banner-host" style="position:fixed;top:0;left:0;right:0"></div>
  <main class="auth-card" id="main">
    <div class="auth-brand">
      <div class="logo"><svg class="i" aria-hidden="true"><use href="/img/icons.svg#drop-logo"/></svg></div>
      <h1 id="plant">Water Plant ERP</h1>
      <p>Sign in to continue</p>
    </div>
    <form id="login" class="stack" novalidate autocomplete="on">
      <div class="form-error" role="alert"></div>
      <div class="field">
        <label for="username">Username</label>
        <input class="input" id="username" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text" required maxlength="40">
        <p class="error"></p>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input-group">
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required maxlength="200" data-nodraft>
          <button class="addon" id="toggle" type="button" aria-label="Show password" aria-pressed="false"><svg class="i" aria-hidden="true"><use href="/img/icons.svg#eye"/></svg></button>
        </div>
        <p class="error"></p>
      </div>
      <button class="btn primary block" id="submit" type="submit"><span class="btn-icon"><svg class="i" aria-hidden="true"><use href="/img/icons.svg#lock"/></svg></span>Sign in</button>
    </form>
    <noscript><p class="banner err">JavaScript is required to sign in.</p></noscript>
  </main>
  <p class="auth-foot" id="foot"></p>
</div>
<script type="module" src="/js/pages/login.js"></script>
</body>
</html>
